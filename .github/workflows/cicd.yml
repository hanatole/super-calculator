name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up UV
        uses: actions/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Check linting
        run: uv run ruff format --check .

      - name: Run unit tests
        run: uv run pytest
